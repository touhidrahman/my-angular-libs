name: Publish npm packages

on:
    push:
        tags:
            - 'ngx-simple-store-v*'
            - 'ngx-common-v*'
            - 'restauth-sdk-v*'
            - 'auditlog-sdk-v*'

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.13.1

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Select package
              id: pkg
              shell: bash
              run: |
                  if [[ "${GITHUB_REF_NAME}" == ngx-simple-store-v* ]]; then
                    echo "lib=ngx-simple-store" >> "$GITHUB_OUTPUT"
                    echo "dist=dist/libs/ngx-simple-store" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF_NAME}" == ngx-common-v* ]]; then
                    echo "lib=ngx-common" >> "$GITHUB_OUTPUT"
                    echo "dist=dist/libs/ngx-common" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF_NAME}" == restauth-sdk-v* ]]; then
                    echo "lib=restauth-sdk" >> "$GITHUB_OUTPUT"
                    echo "dist=dist/libs/restauth-sdk" >> "$GITHUB_OUTPUT"
                  elif [[ "${GITHUB_REF_NAME}" == auditlog-sdk-v* ]]; then
                    echo "lib=auditlog-sdk" >> "$GITHUB_OUTPUT"
                    echo "dist=dist/libs/auditlog-sdk" >> "$GITHUB_OUTPUT"
                  fi

            - run: npx nx build ${{ steps.pkg.outputs.lib }}

            - run: npm install -g npm@latest

            - run: npm publish --access public
              working-directory: ${{ steps.pkg.outputs.dist }}
